workflows:
  ios-gps-unsigned:
    name: LIVEPRO iOS 3.8.4 BLE Tally - unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          if [ -f LivePro.xcodeproj/project.pbxproj ]; then
            project_dir=.
          elif [ -f LiveProIOSGPS/LivePro.xcodeproj/project.pbxproj ]; then
            project_dir=LiveProIOSGPS
          else
            echo "Missing LivePro.xcodeproj. Upload the extracted source files, not the ZIP."
            exit 1
          fi
          cd "$project_dir"
          python3 -c "from pathlib import Path; p=Path('build-unsigned.command'); p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10])))"
          bash build-unsigned.command 2>&1 | tee build-ios.log
    artifacts:
      - "**/build/LIVEPRO-Intercom-unsigned.ipa"
      - "**/build-ios.log"
